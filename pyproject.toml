[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csip"
version = "0.1.0"
description = "Core Strategy & Intelligence Platform (CSIP) — Behavioral Decision Intelligence (BDI) Module"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "CSIP Data Science Team"}
]
keywords = [
    "data-science",
    "skkni",
    
    "behavioral-intelligence",
    "e-commerce",
    "decision-intelligence",
    "world-model",
    "machine-learning"
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "streamlit>=1.30.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "flake8>=6.0.0",
    "black>=23.0.0"
]
ml_advanced = [
    "duckdb>=0.9.0",
    "lightgbm>=4.0.0",
    "shap>=0.42.0",
    "torch>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning"
]

