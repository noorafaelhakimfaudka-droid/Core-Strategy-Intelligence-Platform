# CSIP Pre-Registered Analysis Plan & Research Protocol (V17 Protocol Freeze)
# Standards: SKKNI No. 299 Tahun 2020 | LSP TRI SKM/2905/LSP-TRI/VII/2025
# Governance: Mandatory Pre-Registration & Locked Research Protocol

version: "1.0.0"
protocol_status: "PRE_REGISTERED_FROZEN"
registration_date: "2026-11-11"

research_framing:
  title: "Behavioral Decision Intelligence (BDI) — E-Commerce Customer Experience & Retention"
  module: "CSIP BDI Core Module"
  primary_research_question: >
    Bagaimana hubungan dan interaksi antara struktur biaya transaksi (harga dan ongkos kirim),
    pengalaman pemenuhan pesanan (durasi dan keterlambatan pengiriman), serta karakteristik
    produk terhadap kepuasan dan probabilitas pelanggan melakukan pembelian ulang dalam
    ekosistem e-commerce?

estimands_and_populations:
  M1_delivery_delay:
    model_id: "delivery_delay_lgbm"
    task: "Continuous Lead Time & Delay Regression"
    population: "All dispatched orders with valid carrier handover timestamps (delivered or in-transit)"
    prediction_time: "Carrier dispatch timestamp (order_delivered_carrier_date)"
    target_variable: "delivery_delay_days"
    target_definition: "Actual delivery date minus estimated delivery date (positive = late, negative/zero = early/on-time)"
    primary_metric: "Mean Absolute Error (MAE in days)"
    secondary_metrics: ["RMSE", "WAPE", "R2"]
    decision_rule: >
      Model dianggap berguna secara operasional jika batas atas 95% bootstrap CI MAE
      menunjukkan penurunan minimal 10% dibandingkan baseline terkuat (median predictor).

  M2_retrospective_review_risk:
    model_id: "negative_review_lgbm"
    task: "Binary Negative Review Classification"
    status_label: "RETROSPECTIVE"
    population: "Orders with completed delivery (status == 'delivered') and recorded customer review"
    prediction_time: "Post-delivery completion (order_delivered_customer_date)"
    target_variable: "negative_review_flag"
    target_definition: "1 if review_score in [1, 2], 0 if review_score in [3, 4, 5]"
    primary_metric: "PR-AUC (Average Precision)"
    secondary_metrics: ["ROC-AUC", "Brier Score", "Expected Calibration Error (ECE)"]
    decision_rule: >
      Model dianggap berguna jika batas bawah 95% bootstrap CI PR-AUC > base rate prevalensi positif
      DAN > PR-AUC baseline terkuat (Logistic Regression). Jika batas bawah <= base rate,
      nyatakan model tidak memiliki sinyal prediktif yang cukup.

  M3_repeat_purchase_post_delivery:
    model_id: "repeat_purchase_post_delivery_lgbm"
    task: "Post-Delivery 90-Day Retention Classification & Survival Analysis"
    population: "First-time customers whose order was successfully delivered; excludes 962 pre-delivery repeaters and right-censored buffer"
    prediction_time: "Customer receipt of first order (order_delivered_customer_date)"
    horizon_days: 90
    target_variable: "repeat_purchase_post_delivery_flag"
    target_definition: "1 if second order placed within 90 days of first order delivery, 0 otherwise"
    primary_metric: "PR-AUC (Average Precision)"
    secondary_metrics: ["ROC-AUC", "Brier Score", "C-Index (Survival Concordance)"]
    decision_rule: >
      Model dianggap berguna jika batas bawah 95% CI PR-AUC > base rate positif (2.8%).
      Jika model tidak mengalahkan baseline heuristik/logistik, laporkan secara transparan
      sebagai temuan negatif yang sah (valid negative result).

  M4_repeat_purchase_checkout:
    model_id: "repeat_purchase_checkout_lgbm"
    task: "Checkout-Time Retention Classification (Diagnostic Benchmark)"
    population: "First-time buyers at moment of transaction; excludes right-censored buffer"
    prediction_time: "Order checkout timestamp (order_purchase_timestamp)"
    horizon_days: 90
    target_variable: "repeat_purchase_90d"
    primary_metric: "PR-AUC"
    secondary_metrics: ["ROC-AUC", "Brier Score"]
    decision_rule: "Diagnostic comparator against post-delivery model."

data_exclusion_and_hygiene_rules:
  grain_enforcement:
    rule: "Exactly 1 record per order_id grain (96,470 clean orders)."
  pre_delivery_repeat_exclusion:
    rule: "962 customers who placed repeat orders before first order delivery are excluded from post-delivery retention models."
    rationale: "Predictor contamination and violation of post-delivery estimand definition."
  right_censoring_mitigation:
    rule: "First-time orders occurring within 90 days of dataset maximum date (2018-10-17) are excluded from binary 90-day targets."
    buffer_days: 90
    censored_count: 2275
  non_delivered_orders:
    rule: "Non-delivered orders (625 canceled, 609 unavailable) are excluded from retrospective delivery models and analyzed via checkout risk feasibility study."
  missing_review_treatment:
    rule: "646 missing reviews (0.67%) are analyzed via Manski-type selection bounds; no artificial imputation."

observation_windows:
  primary_window_days: 90
  buffer_days: 90

temporal_split:
  splits:
    train: "2016-09-15 to 2018-03-31"
    validation: "2018-04-01 to 2018-06-30"
    test: "2018-07-01 to 2018-08-31"
    censoring_buffer: "2018-07-19 to 2018-10-17"

cross_validation_scheme:
  cv_type: "Rolling-Origin Expanding-Window Temporal Cross-Validation"
  time_column: "order_purchase_timestamp"
  n_folds: 4
  embargo_days: 90
  min_train_days: 180
  validation_window_days: 60
  strict_embargo_assertion: "max(train_timestamp) + embargo_days < min(val_timestamp)"
  tuning_isolation: "Hyperparameter tuning, threshold selection, and probability calibration MUST occur strictly inside CV."
  locked_test_rule: "Final locked test set (2018-07-01 to 2018-08-31) is evaluated exactly ONCE for final reporting."

candidate_features:
  checkout_available:
    - total_item_price
    - total_freight
    - total_order_value
    - freight_ratio
    - item_count
    - payment_installments_max
    - payment_type_primary
    - customer_state
    - product_category
  post_delivery_available:
    - delivery_lead_time_days
    - estimated_lead_time_days
    - delivery_delay_days
    - is_late
    - approval_lag_hours
    - seller_buyer_distance_km
    - delay_x_freight_ratio
    - distance_x_weight
    - high_value_late_flag

hyperparameter_grids:
  lightgbm:
    learning_rate: [0.01, 0.05, 0.1]
    num_leaves: [15, 31, 63]
    min_child_samples: [20, 50, 100]
    subsample: [0.8, 1.0]
    n_estimators: [50, 100, 200]
  logistic_regression:
    C: [0.001, 0.01, 0.1, 1.0, 10.0]
    penalty: ["l2"]

hypotheses:
  H1:
    statement: "Rasio ongkos kirim terhadap harga (Freight Ratio) berasosiasi negatif terhadap kepuasan transaksi."
    analysis_type: "Multivariate Regression with State & Category Controls"
    target_claim_level: "L2 (Associational)"
    falsification_condition: "p-adj > 0.05 atau beta >= 0 setelah Benjamini-Hochberg correction."
  H2:
    statement: "Keterlambatan pengiriman (Delay > 0) memiliki penalti kepuasan asimetris (non-linear piecewise effect)."
    analysis_type: "Piecewise Linear Spline & Wald Test"
    target_claim_level: "L2 (Associational)"
    falsification_condition: "Wald test F-statistic tidak berbeda signifikan (p-adj > 0.05) antara on-time vs delayed slope."
  H3:
    statement: "Pengalaman pengiriman transaksi pertama berasosiasi signifikan dengan probabilitas pembelian ulang."
    analysis_type: "Logistic Odds Ratio & Survival Analysis"
    target_claim_level: "L2 (Associational)"
    falsification_condition: "Odds ratio 95% CI mencakup 1.0."
  H4:
    statement: "Sensitivitas keterlambatan heterogen antarsegmen perilaku pelanggan."
    analysis_type: "Moderated Interaction Analysis"
    target_claim_level: "L2 (Associational)"
    falsification_condition: "Interaction F-statistic p-adj > 0.05."
  H5:
    statement: "Penggabungan teks review BiLSTM embedding meningkatkan PR-AUC prediksi risiko ulasan di atas fitur tabular."
    analysis_type: "Predictive Ablation on CV"
    target_claim_level: "L1 (Predictive)"
    falsification_condition: "Delta PR-AUC <= 0 pada CV temporal."
  H6:
    statement: "Korelasi nilai transaksi terhadap retensi terdistorsi oleh faktor pembaur geografis dan kategori."
    analysis_type: "Confounder Sensitivity & Manski Bound"
    target_claim_level: "L2 (Associational)"
    falsification_condition: "Perubahan koefisien < 5% setelah confounder adjustment."

statistical_controls:
  multiple_testing_correction: "Benjamini-Hochberg (FDR)"
  familywise_alpha: 0.05
  confidence_level: 0.95
  bootstrap_replications: 1000
