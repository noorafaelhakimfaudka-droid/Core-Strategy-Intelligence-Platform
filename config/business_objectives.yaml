# CSIP Business Objectives & Technical Metrics Alignment
# SKKNI Compliance: [UK-01 Objektif Bisnis], [UK-02 Tujuan Teknis DS]

business_objectives:
  BO_01:
    id: "BO-01"
    title: "Identifikasi Penggerak Retensi & Kepuasan Pelanggan"
    description: >
      Mengungkap faktor ekonomi (harga produk, freight ratio) dan operasional
      (ketepatan waktu, kecepatan pengiriman) yang paling kritis dalam membentuk
      kepuasan pelanggan dan keputusan pembelian ulang (repeat purchase).
    stakeholder: "Marketplace Leadership, Category Managers"
    impact_metric: "Customer Lifetime Value (CLV), Repeat Rate"

  BO_02:
    id: "BO-02"
    title: "Mitigasi Risiko Churn & Ulasan Negatif"
    description: >
      Mendeteksi dini pesanan atau segmen pelanggan berisiko tinggi memberikan ulasan
      buruk (<= 2 bintang) atau churn setelah transaksi pertama untuk dilakukan intervensi proaktif.
    stakeholder: "Customer Experience, Logistics Operations"
    impact_metric: "Negative Review Rate (<= 2 stars), Churn Rate"

  BO_03:
    id: "BO-03"
    title: "Optimalisasi Kebijakan Logistik & Subsidi Ongkir (Alternative World)"
    description: >
      Menyediakan simulasi skenario 'what-if' bagi pengambil keputusan untuk mengevaluasi
      trade-off antara alokasi subsidi ongkir vs perbaikan SLA kurir terhadap proyeksi
      pertumbuhan GMV dan retensi.
    stakeholder: "Finance, Logistics Strategy"
    impact_metric: "Subsidy ROI, Order Growth, Retention Lift"

  BO_04:
    id: "BO-04"
    title: "Efisiensi Alokasi Sumber Daya Berbasis Segmen Perilaku"
    description: >
      Mengelompokkan pelanggan dan transaksi ke dalam klaster perilaku yang dapat ditindaklanjuti
      secara operasional untuk promosi dan penugasan mitra logistik terarah.
    stakeholder: "Growth Marketing, Product Operations"
    impact_metric: "Marketing ROI, Cluster-specific Retention"

technical_targets:
  TT_01:
    id: "TT-01"
    name: "Data Engineering & Konstruksi Bebas Leakage"
    target: "100% lolos automated schema & leakage test (pytest); unhandled nulls = 0% pada fitur model."
    skkni_unit: "UK-06 Membersihkan Data & UK-07 Mengkonstruksi Data"

  TT_02:
    id: "TT-02"
    name: "Unsupervised Learning (Segmentasi)"
    target: "Silhouette Score >= 0.35, Davies-Bouldin terendah, profil klaster stabil lintas waktu."
    skkni_unit: "UK-09 Membangun Model"

  TT_03:
    id: "TT-03"
    name: "Hypothesis Testing & Statistik"
    target: "Minimal 6 hipotesis (H1-H6) diuji dengan kontrol FDR alpha=0.05, effect size + 95% CI."
    skkni_unit: "UK-08 Membangun Skenario Model & UK-10 Mengevaluasi Hasil Pemodelan"

  TT_04:
    id: "TT-04"
    name: "Supervised Learning (Klasifikasi)"
    target: "Mengungguli naive baseline (B0/B1) pada temporal test set untuk PR-AUC, ROC-AUC, F1, Brier Score."
    skkni_unit: "UK-09 Membangun Model & UK-10 Mengevaluasi Hasil Pemodelan"

  TT_05:
    id: "TT-05"
    name: "Supervised Learning (Regresi)"
    target: "Penurunan MAE dan RMSE minimal 10% vs baseline mean predictor pada estimasi waktu pengiriman."
    skkni_unit: "UK-09 Membangun Model & UK-10 Mengevaluasi Hasil Pemodelan"

  TT_06:
    id: "TT-06"
    name: "Neural Network & Deep Learning"
    target: "Arsitektur MLP Embedding tabular dan Text Deep Learning konvergen tanpa overfitting ekstrem."
    skkni_unit: "UK-09 Membangun Model (Deep Learning Competency Lab)"

  TT_07:
    id: "TT-07"
    name: "World Model & Simulasi Skenario"
    target: "Lolos Synthetic Recovery Test, historical replay error terukur, menampilkan 90%/95% prediction interval."
    skkni_unit: "UK-08 Membangun Skenario Model & UK-10 Mengevaluasi Hasil Pemodelan"

